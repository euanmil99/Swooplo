version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: socialpilot-postgres
    environment:
      POSTGRES_DB: socialpilot
      POSTGRES_USER: socialpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-socialpilot123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - socialpilot-network
    restart: unless-stopped

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: socialpilot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - socialpilot-network
    restart: unless-stopped

  # LocalAI for AI capabilities
  localai:
    image: localai/localai:latest-aio-gpu
    container_name: socialpilot-localai
    environment:
      - THREADS=4
      - CONTEXT_SIZE=4096
      - MODELS_PATH=/models
      - GALLERIES=[{"name":"model-gallery","url":"https://raw.githubusercontent.com/go-skynet/model-gallery/index/","gallery":"https://github.com/go-skynet/model-gallery/raw/main/"}]
    volumes:
      - localai_models:/models
      - ./localai-config:/config
    ports:
      - "8080:8080"
    networks:
      - socialpilot-network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Backend API Server
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: socialpilot-backend
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://socialpilot:${POSTGRES_PASSWORD:-socialpilot123}@postgres:5432/socialpilot
      - REDIS_URL=redis://redis:6379
      - LOCALAI_URL=http://localai:8080
      - SESSION_SECRET=${SESSION_SECRET:-your-super-secret-key-change-in-production}
      - JWT_SECRET=${JWT_SECRET:-your-jwt-secret-key-change-in-production}
      - PORT=5000
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
      - localai
    networks:
      - socialpilot-network
    restart: unless-stopped
    volumes:
      - ./uploads:/app/uploads

  # Frontend Client
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: socialpilot-frontend
    environment:
      - VITE_API_URL=http://localhost:5000/api
      - VITE_WS_URL=ws://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - socialpilot-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: socialpilot-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    networks:
      - socialpilot-network
    restart: unless-stopped

  # Monitoring with Prometheus and Grafana
  prometheus:
    image: prom/prometheus:latest
    container_name: socialpilot-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - socialpilot-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: socialpilot-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - socialpilot-network
    restart: unless-stopped

  # Backup service
  backup:
    image: postgres:15-alpine
    container_name: socialpilot-backup
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-socialpilot123}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh
    depends_on:
      - postgres
    networks:
      - socialpilot-network
    command: sh -c "while true; do sleep 86400; sh /backup.sh; done"
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  localai_models:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  socialpilot-network:
    driver: bridge 